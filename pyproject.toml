[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-auditor"
version = "0.1.0"
description = "AI-Powered Security Auditor - SOC 2 Compliance Assessment Tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Chaniyk", email = "example@example.com"}
]
keywords = [
    "security",
    "soc2",
    "compliance",
    "ai",
    "langchain",
    "owasp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "chromadb>=0.4.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black",
    "ruff",
    "mypy",
]
embeddings = [
    "sentence-transformers>=2.2.0",
]

[project.scripts]
security-auditor = "cli.main:main_cli"

[project.urls]
Homepage = "https://github.com/lc29337/ai-security-auditor"
Documentation = "https://github.com/lc29337/ai-security-auditor#readme"
Repository = "https://github.com/lc29337/ai-security-auditor"
Issues = "https://github.com/lc29337/ai-security-auditor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "cli*", "collectors*", "evidence*", "frameworks*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.pytest_cache
)/
'''

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uvicorn]
reload_excludes = ["dashboard/node_modules"]